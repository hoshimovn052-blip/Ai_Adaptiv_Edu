<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-EDU | Individuallashtirilgan Ta'lim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #6366f1; --secondary: #4f46e5; --bg: #f8fafc; }
        body { background-color: var(--bg); font-family: 'Inter', sans-serif; color: #1e293b; overflow-x: hidden; }
        
        /* Hero Section */
        .hero-section { 
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); 
            color: white; padding: 60px 0; border-radius: 0 0 40px 40px; 
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.2);
        }

        /* Subject Cards */
        .card-custom { border: none; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); transition: 0.3s; background: white; }
        .subject-card { cursor: pointer; height: 100%; border-radius: 20px; border: 2px solid transparent; }
        .subject-card:hover { transform: translateY(-10px); border-color: var(--primary); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .icon-box { font-size: 2.5rem; margin-bottom: 15px; color: var(--primary); background: #f5f3ff; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; border-radius: 20px; margin: 0 auto 15px auto; }

        /* Reels & Videos */
        .reels-wrapper { display: flex; overflow-x: auto; gap: 15px; padding: 10px 0; scrollbar-width: none; }
        .reels-wrapper::-webkit-scrollbar { display: none; }
        .reel-item { min-width: 200px; height: 350px; background: #000; border-radius: 15px; overflow: hidden; flex-shrink: 0; position: relative; }
        .video-card { border-radius: 15px; overflow: hidden; background: #000; position: relative; margin-bottom: 15px; }
        .video-card iframe { width: 100%; aspect-ratio: 16/9; }

        /* Quiz Styles */
        .option-label { display: block; padding: 15px; border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; transition: 0.2s; margin-bottom: 12px; font-weight: 500; }
        .option-label:hover { background-color: #f5f3ff; border-color: var(--primary); }
        input[type="radio"]:checked + .option-label { background-color: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3); }
        input[type="radio"] { display: none; }
        
        .nav-pills .nav-link.active { background-color: var(--primary); }
        .nav-link { color: var(--primary); font-weight: 600; }
    </style>
</head>
<body>

    <div id="landing-page" class="hero-section text-center">
        <div class="container animate__animated animate__fadeIn">
            <h1 class="display-4 fw-bold mb-3">Ai Adaptiv Edu</h1>
            <p class="lead mb-5">Individuallashtirilgan kasbiy ta'lim platformasi. BMI 2026.</p>
            <div class="mt-4 mx-auto" style="max-width: 400px;">
                <div class="card-custom p-4 shadow-lg">
                    <input type="text" id="student-name" class="form-control form-control-lg mb-3 text-center border-0 bg-light" placeholder="Ismingizni kiriting...">
                    <button class="btn btn-primary btn-lg w-100 fw-bold rounded-pill shadow" onclick="showCatalog()">Platformaga Kirish <i class="fas fa-rocket ms-2"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="catalog-section" class="container my-5" style="display: none;">
        <div class="d-flex justify-content-between align-items-center mb-5 animate__animated animate__fadeIn">
            <h2 class="fw-bold text-dark m-0"><i class="fas fa-shapes me-2 text-primary"></i>Fanlar Katalogi</h2>
            <div class="text-muted fw-medium" id="welcome-text"></div>
        </div>
        <div class="row g-4" id="subjects-list"></div>
    </div>

    <div id="subject-view" class="container my-5" style="display: none;">
        <button class="btn btn-light mb-4 rounded-pill" onclick="backToCatalog()"><i class="fas fa-arrow-left me-2"></i>Katalogga qaytish</button>
        <h2 id="view-subject-title" class="fw-bold mb-4 text-primary">Fan nomi</h2>

        <ul class="nav nav-pills mb-4 bg-white p-2 rounded-pill shadow-sm d-inline-flex" id="pills-tab">
            <li class="nav-item"><button class="nav-link active rounded-pill px-4" data-bs-toggle="pill" data-bs-target="#tab-reels"><i class="fas fa-bolt me-2"></i>Relislar</button></li>
            <li class="nav-item"><button class="nav-link rounded-pill px-4" data-bs-toggle="pill" data-bs-target="#tab-lessons"><i class="fas fa-play me-2"></i>Video Darslar</button></li>
            <li class="nav-item"><button class="nav-link rounded-pill px-4" data-bs-toggle="pill" data-bs-target="#tab-quiz"><i class="fas fa-vial me-2"></i>Adaptiv Test</button></li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="tab-reels">
                <div class="reels-wrapper" id="reels-list"></div>
            </div>
            <div class="tab-pane fade" id="tab-lessons">
                <div class="row g-4" id="lessons-list"></div>
            </div>
            <div class="tab-pane fade" id="tab-quiz">
                <div class="card-custom p-5 text-center shadow-sm">
                    <i class="fas fa-user-graduate fa-4x text-primary mb-4"></i>
                    <h4>Bilimingizni AI orqali tekshiring</h4>
                    <p class="text-muted mb-4">Ushbu test javoblaringizga qarab qiyinlashib yoki osonlashib boradi.</p>
                    <button class="btn btn-primary btn-lg px-5 rounded-pill fw-bold" onclick="startQuiz()">Testni Boshlash</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container my-5" id="quiz-container" style="display: none;">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card-custom p-4 p-md-5 animate__animated animate__fadeInUp">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 id="quiz-header" class="text-primary fw-bold m-0">Informatika</h4>
                        <span class="badge bg-primary rounded-pill px-3 py-2" id="step-display">Savol: 1/10</span>
                    </div>
                    <div id="difficulty-box" class="mb-3"></div>
                    <div class="progress mb-4" style="height: 10px; border-radius: 10px;">
                        <div id="progress-bar" class="progress-bar bg-success" style="width: 10%"></div>
                    </div>
                    <div id="question-box"></div>
                    <div class="mt-4 text-end">
                        <button class="btn btn-primary btn-lg px-5 rounded-pill fw-bold" onclick="submitAnswer()">Keyingisi <i class="fas fa-chevron-right ms-2"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="result-page" class="container my-5" style="display: none;">
        <div class="row justify-content-center text-center">
            <div class="col-md-7">
                <div class="card-custom p-5 animate__animated animate__zoomIn">
                    <div class="mb-4 text-success"><i class="fas fa-award fa-5x"></i></div>
                    <h2 class="fw-bold mb-2">Test Yakunlandi!</h2>
                    <div class="display-1 fw-bold text-primary my-4" id="final-percent">0%</div>
                    <div id="time-display" class="mb-3 badge bg-light text-dark border p-2"></div>
                    <p class="lead text-dark px-3" id="ai-feedback"></p>
                    <button class="btn btn-primary btn-lg px-5 rounded-pill mt-4" onclick="location.reload()">Bosh Sahifaga Qaytish</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let userName = "", currentSubject = "", quizData = null;

        function showCatalog() {
            userName = document.getElementById("student-name").value;
            if(!userName) return alert("Ismingizni kiriting!");
            document.getElementById("welcome-text").innerText = "Xush kelibsiz, " + userName;
            document.getElementById("landing-page").classList.add('animate__animated', 'animate__fadeOutUp');
            setTimeout(() => {
                document.getElementById("landing-page").style.display = "none";
                document.getElementById("catalog-section").style.display = "block";
                loadSubjects();
            }, 500);
        }

        function loadSubjects() {
            fetch('/api/subjects').then(res => res.json()).then(subjects => {
                const list = document.getElementById('subjects-list');
                const icons = {"Matematika":"fa-calculator", "Fizika":"fa-atom", "Informatika":"fa-laptop-code", "Biologiya":"fa-dna", "Kimyo":"fa-vial", "Ingliz tili":"fa-language", "Geografiya":"fa-globe-americas"};
                list.innerHTML = subjects.map((s, idx) => `
                    <div class="col-md-4 animate__animated animate__fadeInUp" style="animation-delay: ${idx * 0.1}s">
                        <div class="card card-custom subject-card p-4 text-center" onclick="openSubject('${s}')">
                            <div class="icon-box shadow-sm"><i class="fas ${icons[s] || 'fa-book'}"></i></div>
                            <h5 class="fw-bold mb-2">${s}</h5>
                            <p class="small text-muted mb-0">Reels, Video va Testlar</p>
                        </div>
                    </div>
                `).join('');
            });
        }

        function openSubject(s) {
            currentSubject = s;
            document.getElementById('view-subject-title').innerText = s;
            document.getElementById('catalog-section').style.display = 'none';
            document.getElementById('subject-view').style.display = 'block';
            
            // Relislarni yuklash
            loadContent(s, 'reels', 'reels-list');
            // Video darslarni yuklash
            loadContent(s, 'lesson', 'lessons-list');
        }

        function loadContent(subject, type, containerId) {
            fetch(`/api/get_content/${subject}/${type}`).then(res => res.json()).then(data => {
                const container = document.getElementById(containerId);
                if(data.length === 0) {
                    container.innerHTML = `<div class="p-4 text-center text-muted">Hozircha ${type === 'reels' ? 'relislar' : 'videolar'} yo'q.</div>`;
                    return;
                }
                container.innerHTML = data.map(v => `
                    <div class="${type === 'reels' ? 'reel-item shadow' : 'col-md-6'}">
                        <div class="video-card shadow-sm">
                            <iframe src="https://www.youtube.com/embed/${v.url}" allowfullscreen></iframe>
                        </div>
                        <div class="text-center fw-bold small mt-2">${v.title}</div>
                    </div>
                `).join('');
            });
        }

        function startQuiz() {
            fetch(`/start?name=${userName}&subject=${currentSubject}`)
            .then(res => res.json()).then(data => {
                if(data.error) return alert(data.error);
                quizData = data;
                document.getElementById("subject-view").style.display = "none";
                document.getElementById("quiz-container").style.display = "block";
                displayQuestion();
            });
        }

        function displayQuestion() {
            const q = quizData.question;
            document.getElementById("quiz-header").innerText = `${quizData.subject} Testi`;
            document.getElementById("step-display").innerText = `Savol: ${quizData.step}/10`;
            document.getElementById("progress-bar").style.width = (quizData.step * 10) + "%";
            
            const diffClass = q.difficulty_num === 3 ? 'bg-danger' : (q.difficulty_num === 2 ? 'bg-warning text-dark' : 'bg-success');
            document.getElementById("difficulty-box").innerHTML = `<span class="badge ${diffClass} rounded-pill px-3">Daraja: ${q.difficulty_name}</span>`;

            document.getElementById("question-box").innerHTML = `
                <h3 class="mb-4 text-dark fw-bold">${q.question}</h3>
                <div class="options-list">
                    ${q.options.map(opt => `
                        <input type="radio" name="ans" id="opt-${opt}" value="${opt}">
                        <label class="option-label" for="opt-${opt}">${opt}</label>
                    `).join('')}
                </div>`;
        }

        function submitAnswer() {
            const selected = document.querySelector('input[name="ans"]:checked');
            if(!selected) return alert("Iltimos, javobni tanlang!");

            fetch('/check', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    name: userName, question_id: quizData.question.id,
                    answer: selected.value, current_difficulty: quizData.current_difficulty,
                    score: quizData.score, step: quizData.step,
                    subject: quizData.subject, start_time: quizData.start_time
                })
            }).then(res => res.json()).then(data => {
                if(data.finished) {
                    document.getElementById("quiz-container").style.display = "none";
                    document.getElementById("result-page").style.display = "block";
                    document.getElementById("final-percent").innerText = data.percent + "%";
                    document.getElementById("time-display").innerText = `Vaqt: ${data.time} daqiqa`;
                    document.getElementById("ai-feedback").innerText = data.summary;
                } else {
                    quizData.question = data.question;
                    quizData.current_difficulty = data.next_difficulty;
                    quizData.score = data.score;
                    quizData.step = data.step;
                    displayQuestion();
                }
            });
        }

        function backToCatalog() {
            document.getElementById('subject-view').style.display = 'none';
            document.getElementById('catalog-section').style.display = 'block';
        }

        function backToHome() { location.reload(); }
    </script>
</body>
</html>
