<script>
    let name = "", currentDifficulty = 1, score = 0, step = 1, currentQuestionId = null;

    function initiateTest() {
        name = document.getElementById("student-name").value;
        if(!name) return alert("Iltimos, ismingizni yozing!");
        
        // Testni boshlash - 1-darajali savolni olish
        fetch(`/start?name=${name}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById("landing-page").style.display = "none";
                document.getElementById("quiz-container").style.display = "block";
                displayQuestion(data.question);
                currentDifficulty = data.current_difficulty;
                step = data.step;
                score = data.score;
            });
    }

    function displayQuestion(q) {
        if(!q) return;
        currentQuestionId = q.id;
        document.getElementById("subject-title").innerText = q.subject + ` (Daraja: ${currentDifficulty})`;
        
        // Variantlarni radio-tugma ko'rinishida chiqarish (Adaptivlik uchun qulay)
        let optionsHtml = q.options.map(opt => `
            <div class="form-check mb-2">
                <input class="form-check-input" type="radio" name="quiz-option" id="${opt}" value="${opt}">
                <label class="form-check-label w-100 p-2 border rounded" for="${opt}">
                    ${opt}
                </label>
            </div>
        `).join('');

        document.getElementById("question-box").innerHTML = `
            <h3 class="mb-4">${q.question}</h3>
            <div id="options-container">${optionsHtml}</div>
        `;
        
        // Progress barni yangilash (10 ta savolga mo'ljallangan)
        document.getElementById("progress-bar").style.width = (step * 10) + "%";
        document.getElementById("next-btn").innerText = step === 10 ? "Tugatish" : "Keyingisi";
    }

    function nextQuestion() {
        const selected = document.querySelector('input[name="quiz-option"]:checked');
        if(!selected) return alert("Iltimos, javobni tanlang!");

        const answerData = {
            name: name,
            question_id: currentQuestionId,
            answer: selected.value,
            current_difficulty: currentDifficulty,
            score: score,
            step: step
        };

        // Serverga tekshirish uchun yuborish
        fetch("/check", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(answerData)
        })
        .then(res => res.json())
        .then(data => {
            if (data.finished) {
                showResult(data);
            } else {
                // Adaptiv ma'lumotlarni yangilash va keyingi savolni ko'rsatish
                currentDifficulty = data.next_difficulty;
                score = data.score;
                step = data.step;
                
                // Feedback (To'g'ri/Xato) haqida qisqa ma'lumot chiqarish (ixtiyoriy)
                console.log(data.feedback); 
                
                displayQuestion(data.question);
            }
        });
    }

    function showResult(data) {
        document.getElementById("quiz-container").style.display = "none";
        document.getElementById("result-page").style.display = "block";
        document.getElementById("final-percent").innerText = data.percent + "%";
        document.getElementById("ai-feedback").innerText = data.summary;
    }
</script>
