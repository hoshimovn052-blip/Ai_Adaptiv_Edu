<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Adaptiv Edu - Kelajak Ta'limi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root { --primary-color: #4e73df; --secondary-color: #1cc88a; }
        body { background-color: #f8f9fc; font-family: 'Inter', sans-serif; }
        .hero-section { background: linear-gradient(135deg, var(--primary-color) 0%, #224abe 100%); color: white; padding: 60px 0; border-radius: 0 0 50px 50px; }
        .card-custom { border: none; border-radius: 20px; box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15); transition: 0.3s; }
        .progress { height: 10px; border-radius: 5px; margin-bottom: 20px; }
        .option-label { display: block; padding: 12px; border: 2px solid #e3e6f0; border-radius: 10px; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
        .option-label:hover { background-color: #f8f9fc; border-color: var(--primary-color); }
        input[type="radio"]:checked + .option-label { background-color: #4e73df; color: white; border-color: #4e73df; }
        input[type="radio"] { display: none; }
    </style>
</head>
<body>

    <div id="landing-page" class="hero-section text-center animate__animated animate__fadeIn">
        <div class="container">
            <h1 class="display-4 fw-bold">Ai Adaptiv Edu</h1>
            <p class="lead">Sun'iy intellekt asosida kasbiy ta'limni individuallashtirish platformasi</p>
            <div class="mt-5 mx-auto" style="max-width: 400px;">
                <input type="text" id="student-name" class="form-control form-control-lg mb-3 shadow" placeholder="Ismingizni kiriting...">
                <button class="btn btn-light px-5 py-3 fw-bold text-primary shadow" onclick="initiateTest()">Testni Boshlash</button>
            </div>
        </div>
    </div>

    <div class="container my-5" id="quiz-container" style="display: none;">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card card-custom p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 id="subject-title" class="text-primary">Fan nomi</h4>
                        <div class="badge bg-primary p-2" id="step-display">Savol: 1/10</div>
                    </div>
                    <div class="progress">
                        <div id="progress-bar" class="progress-bar bg-success" role="progressbar" style="width: 0%"></div>
                    </div>
                    
                    <div id="question-box" class="animate__animated animate__fadeIn">
                        </div>

                    <div class="mt-4 text-end">
                        <button class="btn btn-primary btn-lg px-5" onclick="nextQuestion()" id="next-btn">Keyingisi</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container my-5" id="result-page" style="display: none;">
        <div class="text-center card card-custom p-5 animate__animated animate__zoomIn">
            <h2 class="text-success mb-4">Tabriklaymiz!</h2>
            <div class="display-1 fw-bold text-primary mb-3" id="final-percent">0%</div>
            <p class="lead" id="ai-feedback"></p>
            <hr>
            <button class="btn btn-primary mt-4 px-5 py-2" onclick="location.reload()">Bosh sahifaga qaytish</button>
            <a href="/admin" class="btn btn-outline-secondary mt-4 ms-2">Natijalar tahlili (Admin)</a>
        </div>
    </div>

    <script>
        let name = "", currentDifficulty = 1, score = 0, step = 1, currentQuestionId = null;

        function initiateTest() {
            name = document.getElementById("student-name").value;
            if(!name) return alert("Iltimos, ismingizni yozing!");
            
            fetch(`/start?name=${name}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById("landing-page").style.display = "none";
                    document.getElementById("quiz-container").style.display = "block";
                    currentDifficulty = data.current_difficulty;
                    step = data.step;
                    score = data.score;
                    displayQuestion(data.question);
                });
        }

        function displayQuestion(q) {
            if(!q) return;
            currentQuestionId = q.id;
            document.getElementById("subject-title").innerText = `${q.subject} (Qiyinlik: ${currentDifficulty})`;
            document.getElementById("step-display").innerText = `Savol: ${step}/10`;
            
            let optionsHtml = q.options.map(opt => `
                <div class="option-item">
                    <input type="radio" name="quiz-option" id="opt-${opt}" value="${opt}">
                    <label class="option-label" for="opt-${opt}">${opt}</label>
                </div>
            `).join('');

            document.getElementById("question-box").innerHTML = `
                <h3 class="mb-4 text-dark">${q.question}</h3>
                <div id="options-container">${optionsHtml}</div>
            `;
            
            document.getElementById("progress-bar").style.width = (step * 10) + "%";
            document.getElementById("next-btn").innerText = step === 10 ? "Tugatish" : "Keyingisi";
        }

        function nextQuestion() {
            const selected = document.querySelector('input[name="quiz-option"]:checked');
            if(!selected) return alert("Iltimos, javobni tanlang!");

            const answerData = {
                name: name,
                question_id: currentQuestionId,
                answer: selected.value,
                current_difficulty: currentDifficulty,
                score: score,
                step: step
            };

            fetch("/check", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(answerData)
            })
            .then(res => res.json())
            .then(data => {
                if (data.finished) {
                    showResult(data);
                } else {
                    currentDifficulty = data.next_difficulty;
                    score = data.score;
                    step = data.step;
                    displayQuestion(data.question);
                }
            });
        }

        function showResult(data) {
            document.getElementById("quiz-container").style.display = "none";
            document.getElementById("result-page").style.display = "block";
            document.getElementById("final-percent").innerText = data.percent + "%";
            document.getElementById("ai-feedback").innerText = data.summary;
        }
    </script>
</body>
</html>
