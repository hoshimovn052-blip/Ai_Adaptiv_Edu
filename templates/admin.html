<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Ai Adaptiv Edu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .sidebar { background: #2c3e50; color: white; min-height: 100vh; padding: 20px; }
        .card-stat { border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .table-container { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .badge-percent { font-size: 0.9rem; padding: 6px 12px; border-radius: 20px; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar d-none d-md-block">
                <h4 class="mb-4 text-info">AI-EDU Admin</h4>
                <hr>
                <a href="/" class="text-white d-block mb-3 text-decoration-none">🏠 Asosiy sahifa</a>
                <a href="/admin" class="text-white d-block mb-3 text-decoration-none fw-bold text-info">📊 Natijalar</a>
            </div>

            <div class="col-md-10 p-4">
                <h2 class="mb-4">O'quvchilar natijalari tahlili</h2>
                
                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="card card-stat bg-white p-3 text-center border-start border-primary border-5">
                            <h6 class="text-muted text-uppercase">Jami o'quvchilar</h6>
                            <h2 id="total-students" class="text-primary">0</h2>
                        </div>
                    </div>
                </div>

                <div class="table-container">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Ism</th>
                                <th>Natija (Foiz)</th>
                                <th>AI Xulosasi</th>
                                <th>Sana va Vaqt</th>
                            </tr>
                        </thead>
                        <tbody id="results">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Natijalarni yuklash
        function loadResults() {
            fetch("/api/results")
                .then(res => {
                    if (res.status === 401) {
                        alert("Ruxsat berilmagan! Login qiling.");
                        return [];
                    }
                    return res.json();
                })
                .then(data => {
                    const resultsTable = document.getElementById("results");
                    document.getElementById("total-students").innerText = data.length;

                    if (data.length === 0) {
                        resultsTable.innerHTML = `<tr><td colspan="4" class="text-center text-muted">Hali natijalar mavjud emas.</td></tr>`;
                        return;
                    }

                    resultsTable.innerHTML = data.map(r => `
                        <tr>
                            <td><strong>${r.name}</strong></td>
                            <td>
                                <span class="badge-percent badge ${r.percent >= 80 ? 'bg-success' : 'bg-warning text-dark'}">
                                    ${r.percent}%
                                </span>
                            </td>
                            <td>${r.feedback}</td>
                            <td class="text-muted small">${r.date}</td>
                        </tr>
                    `).join('');
                })
                .catch(err => console.error("Xatolik:", err));
        }

        // Sahifa yuklanganda ishga tushirish
        loadResults();
    </script>
</body>
</html>
