<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Admin - Natijalar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">
    <h2>O'quvchilar natijalari</h2>
    <table class="table table-striped mt-4">
        <thead>
            <tr><th>Ism</th><th>Foiz</th><th>AI Xulosasi</th></tr>
        </thead>
        <tbody id="results"></tbody>
    </table>
    <script>
        fetch("/get_results").then(res => res.json()).then(data => {
            let html = data.map(r => `<tr><td>${r[0]}</td><td>${r[1]}%</td><td>${r[2]}</td></tr>`).join('');
            document.getElementById("results").innerHTML = html;
        });
    </script>
</body>
</html>
