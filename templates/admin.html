<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Ai Adaptiv Edu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --sidebar-bg: #2c3e50; --main-bg: #f8f9fc; }
        body { background-color: var(--main-bg); font-family: 'Inter', sans-serif; }
        .sidebar { background: var(--sidebar-bg); color: white; min-height: 100vh; padding: 25px; transition: 0.3s; }
        .nav-link { color: rgba(255,255,255,0.7); padding: 12px; border-radius: 10px; margin-bottom: 5px; transition: 0.3s; }
        .nav-link:hover, .nav-link.active { background: rgba(255,255,255,0.1); color: white; }
        .card-stat { border-radius: 15px; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.05); transition: 0.3s; }
        .card-stat:hover { transform: translateY(-5px); }
        .table-container { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 4px 25px rgba(0,0,0,0.06); }
        .badge-percent { font-size: 0.85rem; padding: 7px 14px; border-radius: 50px; font-weight: 600; }
        .subject-tag { background: #eef2f7; color: #4e73df; padding: 4px 10px; border-radius: 5px; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar d-none d-md-block shadow">
                <div class="text-center mb-5">
                    <h4 class="fw-bold text-info"><i class="fas fa-robot me-2"></i>AI-EDU</h4>
                    <small class="text-muted">Boshqaruv Paneli</small>
                </div>
                <nav class="nav flex-column">
                    <a href="/" class="nav-link"><i class="fas fa-home me-2"></i> Asosiy Sahifa</a>
                    <a href="/admin" class="nav-link active"><i class="fas fa-chart-line me-2"></i> Natijalar</a>
                    <a href="#" class="nav-link"><i class="fas fa-users me-2"></i> O'quvchilar</a>
                    <a href="#" class="nav-link"><i class="fas fa-cog me-2"></i> Sozlamalar</a>
                </nav>
            </div>

            <div class="col-md-10 p-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold text-dark">O'quvchilar Natijalari Tahlili</h2>
                    <button class="btn btn-outline-primary" onclick="loadResults()"><i class="fas fa-sync-alt me-2"></i>Yangilash</button>
                </div>
                
                <div class="row mb-5">
                    <div class="col-md-3">
                        <div class="card card-stat p-4 text-center border-start border-primary border-5">
                            <h6 class="text-muted text-uppercase mb-2">Jami Urinishlar</h6>
                            <h2 id="total-students" class="fw-bold text-primary">0</h2>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card card-stat p-4 text-center border-start border-success border-5">
                            <h6 class="text-muted text-uppercase mb-2">O'rtacha Foiz</h6>
                            <h2 id="avg-percent" class="fw-bold text-success">0%</h2>
                        </div>
                    </div>
                </div>

                <div class="table-container animate__animated animate__fadeIn">
                    <table class="table table-hover align-middle border-0">
                        <thead class="bg-light">
                            <tr class="text-muted">
                                <th>O'QUVCHI</th>
                                <th>FAN</th>
                                <th>NATIJA</th>
                                <th>AI TAHLILI</th>
                                <th>SANA</th>
                            </tr>
                        </thead>
                        <tbody id="results">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        function loadResults() {
            fetch("/api/results")
                .then(res => res.status === 401 ? (alert("Kirish taqiqlandi!"), []) : res.json())
                .then(data => {
                    const table = document.getElementById("results");
                    document.getElementById("total-students").innerText = data.length;
                    
                    if (data.length > 0) {
                        const avg = data.reduce((acc, curr) => acc + curr.percent, 0) / data.length;
                        document.getElementById("avg-percent").innerText = Math.round(avg) + "%";
                    }

                    if (data.length === 0) {
                        table.innerHTML = `<tr><td colspan="5" class="text-center py-5 text-muted">Hali natijalar mavjud emas.</td></tr>`;
                        return;
                    }

                    table.innerHTML = data.map(r => `
                        <tr>
                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 40px; height: 40px;">
                                        ${r.name.charAt(0).toUpperCase()}
                                    </div>
                                    <span class="fw-bold">${r.name}</span>
                                </div>
                            </td>
                            <td><span class="subject-tag">${r.subject || 'Umumiy'}</span></td>
                            <td>
                                <span class="badge-percent ${r.percent >= 80 ? 'bg-success text-white' : (r.percent >= 50 ? 'bg-warning text-dark' : 'bg-danger text-white')}">
                                    ${r.percent}%
                                </span>
                            </td>
                            <td><small class="text-dark">${r.feedback}</small></td>
                            <td class="text-muted small">${new Date(r.date).toLocaleString('uz-UZ')}</td>
                        </tr>
                    `).join('');
                })
                .catch(err => console.error("Xatolik:", err));
        }

        loadResults();
        // Har 30 soniyada ma'lumotlarni avtomatik yangilab turish
        setInterval(loadResults, 30000);
    </script>
</body>
</html>
